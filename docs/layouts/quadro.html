<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Quadro de apresentação</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e7e5e4; font: 15px/1.4 "Segoe UI", system-ui, sans-serif; color: #1c1917; }
  .quadro { width: 1860px; padding: 34px 40px 40px; }
  .titulo { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; }
  .titulo b { font-size: 15px; background: #1c1917; color: #fff; border-radius: 8px; padding: 3px 11px; }
  .titulo h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
  .titulo p { margin: 0 0 0 auto; color: #57534e; font-size: 15px; max-width: 760px; text-align: right; }
  .telas { display: flex; gap: 40px; align-items: flex-start; }
  .janela { border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.18); background: #fff; }
  .barra { height: 38px; background: #f5f5f4; border-bottom: 1px solid #e7e5e4; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .barra i { width: 12px; height: 12px; border-radius: 50%; background: #d6d3d1; }
  .barra span { margin-left: 18px; flex: 0 0 420px; height: 24px; border-radius: 7px; background: #fff; border: 1px solid #e7e5e4; font-size: 12.5px; color: #78716c; display: flex; align-items: center; padding: 0 10px; }
  .celular { width: 414px; padding: 12px; background: #1c1917; border-radius: 46px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
  .celular .tela { border-radius: 36px; overflow: hidden; background: #fff; }
  iframe { border: 0; display: block; }
  .legenda { text-align: center; font-size: 13px; color: #57534e; margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="quadro">
  <div class="titulo"><b id="letra"></b><h1 id="nome"></h1><p id="desc"></p></div>
  <div class="telas">
    <div>
      <div class="janela"><div class="barra"><i></i><i></i><i></i><span>pixelecia.com.br</span></div>
        <iframe id="desktop" width="1320" height="820"></iframe></div>
      <div class="legenda">Computador</div>
    </div>
    <div>
      <div class="celular"><div class="tela"><iframe id="mobile" width="390" height="820"></iframe></div></div>
      <div class="legenda">Celular</div>
    </div>
  </div>
</div>
<script>
  const INFO = {
    a: ['Vitrine com barra lateral', 'Filtros sempre visíveis à esquerda: categoria (uma) e temas (vários, com caixinhas). No celular viram dois botões que abrem a lista.'],
    b: ['Capa da loja + filtros em faixas', 'Capa com a cor e o logo da loja em destaque. Categorias em abas e temas em pílulas coloridas logo abaixo. Sem barra lateral, grade mais larga.'],
    c: ['Prateleiras por categoria', 'Temas em círculos no topo (estilo stories do Instagram). Cada categoria é uma prateleira que rola para o lado, com “Ver todos”. Tema escuro.'],
  };
  const l = new URLSearchParams(location.search).get('l') || 'a';
  document.getElementById('letra').textContent = `Layout ${l.toUpperCase()}`;
  document.getElementById('nome').textContent = INFO[l][0];
  document.getElementById('desc').textContent = INFO[l][1];
  document.getElementById('desktop').src = `layout-${l}.html`;
  document.getElementById('mobile').src = `layout-${l}.html`;
</script>
</body>
</html>
