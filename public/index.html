<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Produtos</title>
  <meta name="description" content="Catálogo de produtos.">
  <link rel="icon" href="/img/icone.svg" type="image/svg+xml" id="favicon">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/catalogo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-interno">
      <a class="marca" href="/" id="marca">
        <span class="logo logo-monograma" aria-hidden="true"></span>
        <span class="marca-textos"><strong class="marca-nome" id="nome-loja">&nbsp;</strong><small class="marca-slogan" id="slogan-loja"></small></span>
      </a>
      <form class="busca" id="form-busca" role="search">
        <label class="sr-only" for="busca">Buscar produtos</label>
        <span class="busca-icone" aria-hidden="true"></span>
        <input class="input" id="busca" type="search" placeholder="Buscar produtos…" autocomplete="off">
      </form>
      <nav class="redes" id="redes" aria-label="Redes sociais da loja"></nav>
    </div>
  </header>

  <div class="layout">
    <aside class="lateral" id="lateral" aria-label="Filtros">
      <div class="lateral-topo">
        <strong>Filtros</strong>
        <button class="btn btn-fantasma btn-icone" type="button" id="fechar-lateral" aria-label="Fechar filtros"></button>
      </div>
      <section aria-labelledby="titulo-categorias" id="secao-categorias">
        <h2 class="lateral-titulo" id="titulo-categorias">Categorias</h2>
        <ul class="lista-filtro" id="lista-categorias"><li class="carregando">Carregando…</li></ul>
      </section>
      <section aria-labelledby="titulo-temas" id="secao-temas">
        <h2 class="lateral-titulo" id="titulo-temas">Temas</h2>
        <ul class="lista-filtro" id="lista-temas"></ul>
      </section>
      <div class="lateral-rodape">
        <button class="btn btn-marca btn-bloco" type="button" id="ver-resultados"></button>
      </div>
    </aside>

    <main class="conteudo" id="conteudo">
      <div class="filtros-mobile">
        <button class="btn" type="button" data-abrir="secao-categorias"><span data-icone="filtro"></span>Categorias</button>
        <button class="btn" type="button" data-abrir="secao-temas">Temas <span class="selo-contagem" id="contagem-temas" hidden></span></button>
      </div>
      <div class="barra">
        <h1 id="titulo">Todos os produtos</h1>
        <span class="quantidade-resultados" id="resultado" aria-live="polite"></span>
        <div class="chips" id="chips"></div>
        <label class="ordenar">
          <span class="sr-only">Ordenar por</span>
          <select class="select" id="ordem">
            <option value="">Destaques</option>
            <option value="recentes">Mais recentes</option>
            <option value="nome">Nome (A–Z)</option>
            <option value="menor_preco">Menor preço</option>
            <option value="maior_preco">Maior preço</option>
          </select>
        </label>
      </div>
      <div class="grade" id="grade" aria-busy="true"></div>
    </main>
  </div>

  <footer class="rodape" id="rodape"></footer>

  <div class="veu" id="veu-lateral"></div>
  <dialog class="modal modal-produto" id="modal-produto" aria-labelledby="titulo-produto"></dialog>

  <script type="module" src="/js/catalogo.js"></script>
</body>
</html>
